<svg viewBox="0 0 540 135" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:0 auto; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadowFlat" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="realWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c4427"/>
      <stop offset="25%" stop-color="#ab5634"/>
      <stop offset="70%" stop-color="#b85f3d"/>
      <stop offset="100%" stop-color="#7d3b20"/>
    </linearGradient>
  </defs>

  <!-- ================= 1. ÉTIQUETTES GAUCHE ================= -->
  <!-- Clé Haut Gauche : Corde 3 — DO (C) [La plus grave] -->
  <g transform="translate(6, 14)">
    <rect x="0" y="0" width="112" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3" filter="url(#shadowFlat)"/>
    <rect x="5" y="4" width="22" height="22" rx="4" fill="#2563eb"/>
    <text x="16" y="19.5" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">C</text>
    <text x="33" y="13.5" font-size="7.2" font-weight="800" fill="#1e40af">CORDE 3 • DO</text>
    <text x="33" y="23" font-size="6" font-weight="700" fill="#2563eb">Clé haut gauche (Grave)</text>
    <!-- Ligne droite vers le post haut gauche -->
    <line x1="112" y1="15" x2="154" y2="24" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="2.5,2"/>
    <circle cx="154" cy="24" r="2.2" fill="#3b82f6"/>
  </g>

  <!-- Clé Bas Gauche : Corde 4 — SOL (G) -->
  <g transform="translate(6, 62)">
    <rect x="0" y="0" width="112" height="30" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.3" filter="url(#shadowFlat)"/>
    <rect x="5" y="4" width="22" height="22" rx="4" fill="#ea580c"/>
    <text x="16" y="19.5" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">G</text>
    <text x="33" y="13.5" font-size="7.2" font-weight="800" fill="#9a3412">CORDE 4 • SOL</text>
    <text x="33" y="23" font-size="6" font-weight="600" fill="#c2410c">Clé bas gauche</text>
    <!-- Ligne droite vers le post bas gauche -->
    <line x1="112" y1="15" x2="154" y2="6" stroke="#f97316" stroke-width="1.4" stroke-dasharray="2.5,2" transform="translate(0, 62)"/>
    <circle cx="154" cy="68" r="2.2" fill="#f97316"/>
  </g>


  <!-- ================= 2. TÊTE & MANCHE (CONFORME À LA PHOTO RÉELLE) ================= -->
  <g transform="translate(160, 4)" filter="url(#shadowFlat)">
    <!-- Touche (Palissandre foncé) -->
    <rect x="18" y="74" width="36" height="54" fill="#291811" rx="1"/>
    <!-- Frettes argentées -->
    <line x1="18" y1="88" x2="54" y2="88" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="18" y1="104" x2="54" y2="104" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="18" y1="120" x2="54" y2="120" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Sillet de tête (Nut) ivoire -->
    <rect x="16" y="67" width="40" height="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" rx="1.5"/>

    <!-- Tête de manche Acajou (Galbe 3 pointes comme la photo) -->
    <path d="M 18,67 
             C 14,48 11,26 13,15 
             C 14,7 20,4 27,6 
             C 31,8 36,4 36,4 
             C 36,4 41,8 45,6 
             C 52,4 58,7 59,15 
             C 61,26 58,48 54,67 Z" 
          fill="url(#realWood)" stroke="#5c2411" stroke-width="1.3"/>

    <!-- 4 Mécaniques avec oeillets chromés et boutons noirs (comme sur la photo) -->
    <!-- Haut Gauche Post -->
    <circle cx="22" cy="24" r="4.5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="22" cy="24" r="2.2" fill="#334155"/>
    <rect x="4" y="22.5" width="13" height="3" fill="#cbd5e1" rx="0.5"/>
    <ellipse cx="4" cy="24" rx="4" ry="6.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>

    <!-- Bas Gauche Post -->
    <circle cx="22" cy="50" r="4.5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="22" cy="50" r="2.2" fill="#334155"/>
    <rect x="4" y="48.5" width="13" height="3" fill="#cbd5e1" rx="0.5"/>
    <ellipse cx="4" cy="50" rx="4" ry="6.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>

    <!-- Haut Droite Post -->
    <circle cx="50" cy="24" r="4.5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="50" cy="24" r="2.2" fill="#334155"/>
    <rect x="55" y="22.5" width="13" height="3" fill="#cbd5e1" rx="0.5"/>
    <ellipse cx="68" cy="24" rx="4" ry="6.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>

    <!-- Bas Droite Post -->
    <circle cx="50" cy="50" r="4.5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="50" cy="50" r="2.2" fill="#334155"/>
    <rect x="55" y="48.5" width="13" height="3" fill="#cbd5e1" rx="0.5"/>
    <ellipse cx="68" cy="50" rx="4" ry="6.5" fill="#0f172a" stroke="#334155" stroke-width="1"/>

    <!-- ================= 4 CORDES EXACTES SELON LA PHOTO ================= -->
    <!-- CORDE 4 (SOL) : De la fente gauche (21) tout droit vers le post BAS GAUCHE (22, 50) -->
    <line x1="22" y1="50" x2="21" y2="67" stroke="#ea580c" stroke-width="1.6"/>
    <line x1="21" y1="67" x2="21" y2="128" stroke="#ea580c" stroke-width="1.6"/>

    <!-- CORDE 3 (DO) : De la fente intérieure gauche (29) remontant vers le post HAUT GAUCHE (22, 24) -->
    <line x1="22" y1="24" x2="29" y2="67" stroke="#2563eb" stroke-width="2.4"/>
    <line x1="29" y1="67" x2="29" y2="128" stroke="#2563eb" stroke-width="2.4"/>

    <!-- CORDE 2 (MI) : De la fente intérieure droite (43) remontant vers le post HAUT DROITE (50, 24) -->
    <line x1="50" y1="24" x2="43" y2="67" stroke="#059669" stroke-width="1.6"/>
    <line x1="43" y1="67" x2="43" y2="128" stroke="#059669" stroke-width="1.6"/>

    <!-- CORDE 1 (LA) : De la fente droite (51) tout droit vers le post BAS DROITE (50, 50) -->
    <line x1="50" y1="50" x2="51" y2="67" stroke="#dc2626" stroke-width="1.2"/>
    <line x1="51" y1="67" x2="51" y2="128" stroke="#dc2626" stroke-width="1.2"/>
  </g>


  <!-- ================= 3. ÉTIQUETTES DROITE ================= -->
  <!-- Clé Haut Droite : Corde 2 — MI (E) -->
  <g transform="translate(240, 14)">
    <line x1="-8" y1="10" x2="0" y2="15" stroke="#10b981" stroke-width="1.4" stroke-dasharray="2.5,2"/>
    <circle cx="-8" cy="10" r="2.2" fill="#10b981"/>
    <rect x="0" y="0" width="112" height="30" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3" filter="url(#shadowFlat)"/>
    <rect x="5" y="4" width="22" height="22" rx="4" fill="#059669"/>
    <text x="16" y="19.5" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">E</text>
    <text x="33" y="13.5" font-size="7.2" font-weight="800" fill="#065f46">CORDE 2 • MI</text>
    <text x="33" y="23" font-size="6" font-weight="600" fill="#047857">Clé haut droite</text>
  </g>

  <!-- Clé Bas Droite : Corde 1 — LA (A) [La plus aiguë] -->
  <g transform="translate(240, 62)">
    <line x1="-8" y1="6" x2="0" y2="15" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="2.5,2"/>
    <circle cx="-8" cy="6" r="2.2" fill="#ef4444"/>
    <rect x="0" y="0" width="112" height="30" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.3" filter="url(#shadowFlat)"/>
    <rect x="5" y="4" width="22" height="22" rx="4" fill="#dc2626"/>
    <text x="16" y="19.5" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">A</text>
    <text x="33" y="13.5" font-size="7.2" font-weight="800" fill="#991b1b">CORDE 1 • LA</text>
    <text x="33" y="23" font-size="6" font-weight="700" fill="#dc2626">Clé bas droite (Aiguë)</text>
  </g>


  <!-- ================= 4. JAUGE DE HAUTEUR RÉELLE DU SON (PITCH LADDER) ================= -->
  <g transform="translate(366, 6)">
    <!-- Fond -->
    <rect x="0" y="0" width="168" height="122" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadowFlat)"/>
    
    <!-- En-tête -->
    <rect x="5" y="5" width="158" height="16" rx="3.5" fill="#0f172a"/>
    <text x="84" y="16" text-anchor="middle" font-size="6.5" font-weight="800" fill="#f8fafc" letter-spacing="0.4">HAUTEUR DU SON (PITCH)</text>

    <!-- Étape 4 (Sommet) : Corde 1 - La (A) - Le plus aigu -->
    <g transform="translate(8, 25)">
      <rect x="0" y="0" width="152" height="20" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <rect x="3" y="3" width="16" height="14" rx="2.5" fill="#dc2626"/>
      <text x="11" y="13.5" text-anchor="middle" font-size="8" font-weight="900" fill="#ffffff">A</text>
      <text x="24" y="9.5" font-size="6.5" font-weight="800" fill="#991b1b">Corde 1 — LA (440 Hz)</text>
      <text x="24" y="16.5" font-size="5.4" font-weight="700" fill="#dc2626">▲ 4. LE PLUS AIGU</text>
    </g>

    <!-- Étape 3 : Corde 4 - Sol (G) - Accord réentrant -->
    <g transform="translate(8, 48)">
      <rect x="0" y="0" width="152" height="20" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
      <rect x="3" y="3" width="16" height="14" rx="2.5" fill="#ea580c"/>
      <text x="11" y="13.5" text-anchor="middle" font-size="8" font-weight="900" fill="#ffffff">G</text>
      <text x="24" y="9.5" font-size="6.5" font-weight="800" fill="#9a3412">Corde 4 — SOL (392 Hz)</text>
      <text x="24" y="16.5" font-size="5.4" font-weight="800" fill="#c2410c">⚡ 3. Sol aigu (réentrant)</text>
    </g>

    <!-- Étape 2 : Corde 2 - Mi (E) -->
    <g transform="translate(8, 71)">
      <rect x="0" y="0" width="152" height="20" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
      <rect x="3" y="3" width="16" height="14" rx="2.5" fill="#059669"/>
      <text x="11" y="13.5" text-anchor="middle" font-size="8" font-weight="900" fill="#ffffff">E</text>
      <text x="24" y="9.5" font-size="6.5" font-weight="800" fill="#065f46">Corde 2 — MI (330 Hz)</text>
      <text x="24" y="16.5" font-size="5.4" font-weight="600" fill="#047857">● 2. Médium</text>
    </g>

    <!-- Étape 1 (Base) : Corde 3 - Do (C) - Le plus grave -->
    <g transform="translate(8, 94)">
      <rect x="0" y="0" width="152" height="20" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <rect x="3" y="3" width="16" height="14" rx="2.5" fill="#2563eb"/>
      <text x="11" y="13.5" text-anchor="middle" font-size="8" font-weight="900" fill="#ffffff">C</text>
      <text x="24" y="9.5" font-size="6.5" font-weight="800" fill="#1e40af">Corde 3 — DO (261 Hz)</text>
      <text x="24" y="16.5" font-size="5.4" font-weight="700" fill="#2563eb">▼ 1. LE PLUS GRAVE</text>
    </g>
  </g>

</svg>