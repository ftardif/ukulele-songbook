<svg viewBox="0 0 420 130" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:0 auto; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="ukuleleWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c4427"/>
      <stop offset="25%" stop-color="#ab5634"/>
      <stop offset="70%" stop-color="#b85f3d"/>
      <stop offset="100%" stop-color="#7d3b20"/>
    </linearGradient>
  </defs>

  <!-- ================= 1. CASES GAUCHE (PLACÉES DIRECTEMENT CONTRE LES CLÉS) ================= -->
  
  <!-- HAUT GAUCHE : CORDE 3 • DO (C) [BLEU] -->
  <g transform="translate(10, 12)">
    <rect x="0" y="0" width="138" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#boxShadow)"/>
    <rect x="7" y="7" width="34" height="34" rx="6" fill="#2563eb"/>
    <text x="24" y="29.5" text-anchor="middle" font-size="17" font-weight="900" fill="#ffffff">C</text>
    <text x="48" y="21" font-size="9.5" font-weight="900" fill="#1e40af">CORDE 3 • DO</text>
    <text x="48" y="34" font-size="7.5" font-weight="700" fill="#2563eb">Clé haut gauche (Grave)</text>
  </g>

  <!-- BAS GAUCHE : CORDE 4 • SOL (G) [ORANGE] -->
  <g transform="translate(10, 68)">
    <rect x="0" y="0" width="138" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5" filter="url(#boxShadow)"/>
    <rect x="7" y="7" width="34" height="34" rx="6" fill="#ea580c"/>
    <text x="24" y="29.5" text-anchor="middle" font-size="17" font-weight="900" fill="#ffffff">G</text>
    <text x="48" y="21" font-size="9.5" font-weight="900" fill="#9a3412">CORDE 4 • SOL</text>
    <text x="48" y="34" font-size="7.5" font-weight="700" fill="#c2410c">Clé bas gauche (Réentrant)</text>
  </g>


  <!-- ================= 2. TÊTE & MANCHE (CENTRE - REPRODUCTION PHOTO) ================= -->
  <g transform="translate(164, 4)" filter="url(#boxShadow)">
    <!-- Touche (Palissandre) -->
    <rect x="27" y="72" width="38" height="54" fill="#291811" rx="1"/>
    <!-- Frettes -->
    <line x1="27" y1="86" x2="65" y2="86" stroke="#cbd5e1" stroke-width="1.3"/>
    <line x1="27" y1="102" x2="65" y2="102" stroke="#cbd5e1" stroke-width="1.3"/>
    <line x1="27" y1="118" x2="65" y2="118" stroke="#cbd5e1" stroke-width="1.3"/>

    <!-- Sillet de tête blanc -->
    <rect x="25" y="65" width="42" height="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="1.5"/>

    <!-- Tête de manche Acajou (3 pointes) -->
    <path d="M 27,65 
             C 23,46 20,24 22,14 
             C 23,7 29,4 36,6 
             C 40,8 46,4 46,4 
             C 46,4 52,8 56,6 
             C 63,4 69,7 70,14 
             C 72,24 69,46 65,65 Z" 
          fill="url(#ukuleleWood)" stroke="#5c2411" stroke-width="1.5"/>

    <!-- 4 Mécaniques : boutons noirs ovales placés tout contre les cases -->
    <!-- Haut Gauche -->
    <circle cx="31" cy="22" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="31" cy="22" r="2.5" fill="#334155"/>
    <rect x="12" y="20.5" width="14" height="3" fill="#cbd5e1" rx="0.5"/>
    <ellipse cx="10" cy="22" rx="5" ry="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>

    <!-- Bas Gauche -->
    <circle cx="31" cy="48" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="31" cy="48" r="2.5" fill="#334155"/>
    <rect x="12" y="46.5" width="14" height="3" fill="#cbd5e1" rx="0.5"/>
    <ellipse cx="10" cy="48" rx="5" ry="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>

    <!-- Haut Droite -->
    <circle cx="61" cy="22" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="61" cy="22" r="2.5" fill="#334155"/>
    <rect x="66" y="20.5" width="14" height="3" fill="#cbd5e1" rx="0.5"/>
    <ellipse cx="82" cy="22" rx="5" ry="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>

    <!-- Bas Droite -->
    <circle cx="61" cy="48" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="61" cy="48" r="2.5" fill="#334155"/>
    <rect x="66" y="46.5" width="14" height="3" fill="#cbd5e1" rx="0.5"/>
    <ellipse cx="82" cy="48" rx="5" ry="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>

    <!-- ================= 4 CORDES FORTEMENT COLORÉES SELON LEUR ENCADRÉ ================= -->
    <!-- CORDE 4 : SOL (ORANGE VIF #ea580c) -->
    <line x1="31" y1="48" x2="30" y2="65" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="30" y1="65" x2="30" y2="126" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round"/>

    <!-- CORDE 3 : DO (BLEU ROYAL VIF #2563eb - la plus épaisse) -->
    <line x1="31" y1="22" x2="39" y2="65" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="39" y1="65" x2="39" y2="126" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round"/>

    <!-- CORDE 2 : MI (VERT ÉMERAUDE VIF #059669) -->
    <line x1="61" y1="22" x2="53" y2="65" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="53" y1="65" x2="53" y2="126" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>

    <!-- CORDE 1 : LA (ROUGE VIF #dc2626 - la plus fine) -->
    <line x1="61" y1="48" x2="62" y2="65" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="62" y1="65" x2="62" y2="126" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
  </g>


  <!-- ================= 3. CASES DROITE (PLACÉES DIRECTEMENT CONTRE LES CLÉS) ================= -->
  
  <!-- HAUT DROITE : CORDE 2 • MI (E) [VERT] -->
  <g transform="translate(272, 12)">
    <rect x="0" y="0" width="138" height="48" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2.5" filter="url(#boxShadow)"/>
    <rect x="7" y="7" width="34" height="34" rx="6" fill="#059669"/>
    <text x="24" y="29.5" text-anchor="middle" font-size="17" font-weight="900" fill="#ffffff">E</text>
    <text x="48" y="21" font-size="9.5" font-weight="900" fill="#065f46">CORDE 2 • MI</text>
    <text x="48" y="34" font-size="7.5" font-weight="700" fill="#047857">Clé haut droite</text>
  </g>

  <!-- BAS DROITE : CORDE 1 • LA (A) [ROUGE] -->
  <g transform="translate(272, 68)">
    <rect x="0" y="0" width="138" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" filter="url(#boxShadow)"/>
    <rect x="7" y="7" width="34" height="34" rx="6" fill="#dc2626"/>
    <text x="24" y="29.5" text-anchor="middle" font-size="17" font-weight="900" fill="#ffffff">A</text>
    <text x="48" y="21" font-size="9.5" font-weight="900" fill="#991b1b">CORDE 1 • LA</text>
    <text x="48" y="34" font-size="7.5" font-weight="700" fill="#dc2626">Clé bas droite (Aiguë)</text>
  </g>

</svg>