<svg viewBox="0 0 424 136" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:0 auto; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="ukeWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c4427"/>
      <stop offset="25%" stop-color="#ab5634"/>
      <stop offset="70%" stop-color="#b85f3d"/>
      <stop offset="100%" stop-color="#7d3b20"/>
    </linearGradient>
  </defs>

  <!-- ================= 1. CASES GAUCHE (3 LIGNES AÉRÉES) ================= -->
  
  <!-- HAUT GAUCHE : CORDE 3 • DO (C) [BLEU] -->
  <g transform="translate(6, 10)">
    <rect x="0" y="0" width="144" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2" filter="url(#cardShadow)"/>
    <!-- Icone Lettre -->
    <rect x="7" y="8" width="36" height="36" rx="6" fill="#2563eb"/>
    <text x="25" y="32.5" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">C</text>
    <!-- 3 Lignes de texte -->
    <text x="50" y="19" font-size="7.2" font-weight="800" fill="#1e40af" letter-spacing="0.4">CORDE 3</text>
    <text x="50" y="32.5" font-size="11.5" font-weight="900" fill="#1e3a8a">DO (C)</text>
    <text x="50" y="44" font-size="6.8" font-weight="700" fill="#2563eb">Clé haut g. • Grave</text>
  </g>

  <!-- BAS GAUCHE : CORDE 4 • SOL (G) [ORANGE] -->
  <g transform="translate(6, 72)">
    <rect x="0" y="0" width="144" height="52" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2" filter="url(#cardShadow)"/>
    <!-- Icone Lettre -->
    <rect x="7" y="8" width="36" height="36" rx="6" fill="#ea580c"/>
    <text x="25" y="32.5" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">G</text>
    <!-- 3 Lignes de texte -->
    <text x="50" y="19" font-size="7.2" font-weight="800" fill="#9a3412" letter-spacing="0.4">CORDE 4</text>
    <text x="50" y="32.5" font-size="11.5" font-weight="900" fill="#7c2d12">SOL (G)</text>
    <text x="50" y="44" font-size="6.8" font-weight="700" fill="#c2410c">Clé bas g. • Réentrant</text>
  </g>


  <!-- ================= 2. TÊTE & MANCHE (CENTRE - REPRODUCTION PHOTO) ================= -->
  <g transform="translate(166, 4)" filter="url(#cardShadow)">
    <!-- Touche (Palissandre) -->
    <rect x="27" y="76" width="38" height="56" fill="#291811" rx="1"/>
    <!-- Frettes -->
    <line x1="27" y1="92" x2="65" y2="92" stroke="#cbd5e1" stroke-width="1.3"/>
    <line x1="27" y1="108" x2="65" y2="108" stroke="#cbd5e1" stroke-width="1.3"/>
    <line x1="27" y1="124" x2="65" y2="124" stroke="#cbd5e1" stroke-width="1.3"/>

    <!-- Sillet de tête blanc -->
    <rect x="25" y="69" width="42" height="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="1.5"/>

    <!-- Tête de manche Acajou (3 pointes) -->
    <path d="M 27,69 
             C 23,50 20,26 22,15 
             C 23,7 29,4 36,6 
             C 40,8 46,4 46,4 
             C 46,4 52,8 56,6 
             C 63,4 69,7 70,15 
             C 72,26 69,50 65,69 Z" 
          fill="url(#ukeWood)" stroke="#5c2411" stroke-width="1.5"/>

    <!-- 4 Mécaniques : boutons noirs ovales placés directement contre les cases -->
    <!-- Haut Gauche -->
    <circle cx="31" cy="24" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="31" cy="24" r="2.5" fill="#334155"/>
    <rect x="12" y="22.5" width="14" height="3" fill="#cbd5e1" rx="0.5"/>
    <ellipse cx="10" cy="24" rx="5" ry="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>

    <!-- Bas Gauche -->
    <circle cx="31" cy="52" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="31" cy="52" r="2.5" fill="#334155"/>
    <rect x="12" y="50.5" width="14" height="3" fill="#cbd5e1" rx="0.5"/>
    <ellipse cx="10" cy="52" rx="5" ry="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>

    <!-- Haut Droite -->
    <circle cx="61" cy="24" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="61" cy="24" r="2.5" fill="#334155"/>
    <rect x="66" y="22.5" width="14" height="3" fill="#cbd5e1" rx="0.5"/>
    <ellipse cx="82" cy="24" rx="5" ry="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>

    <!-- Bas Droite -->
    <circle cx="61" cy="52" r="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="61" cy="52" r="2.5" fill="#334155"/>
    <rect x="66" y="50.5" width="14" height="3" fill="#cbd5e1" rx="0.5"/>
    <ellipse cx="82" cy="52" rx="5" ry="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>

    <!-- ================= 4 CORDES FORTEMENT COLORÉES ================= -->
    <!-- CORDE 4 : SOL (ORANGE VIF #ea580c) -->
    <line x1="31" y1="52" x2="30" y2="69" stroke="#ea580c" stroke-width="2.3" stroke-linecap="round"/>
    <line x1="30" y1="69" x2="30" y2="132" stroke="#ea580c" stroke-width="2.3" stroke-linecap="round"/>

    <!-- CORDE 3 : DO (BLEU ROYAL VIF #2563eb - plus épaisse) -->
    <line x1="31" y1="24" x2="39" y2="69" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="39" y1="69" x2="39" y2="132" stroke="#2563eb" stroke-width="3.4" stroke-linecap="round"/>

    <!-- CORDE 2 : MI (VERT ÉMERAUDE VIF #059669) -->
    <line x1="61" y1="24" x2="53" y2="69" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="53" y1="69" x2="53" y2="132" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>

    <!-- CORDE 1 : LA (ROUGE VIF #dc2626 - plus fine) -->
    <line x1="61" y1="52" x2="62" y2="69" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="62" y1="69" x2="62" y2="132" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
  </g>


  <!-- ================= 3. CASES DROITE (3 LIGNES AÉRÉES) ================= -->
  
  <!-- HAUT DROITE : CORDE 2 • MI (E) [VERT] -->
  <g transform="translate(274, 10)">
    <rect x="0" y="0" width="144" height="52" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2.2" filter="url(#cardShadow)"/>
    <!-- Icone Lettre -->
    <rect x="7" y="8" width="36" height="36" rx="6" fill="#059669"/>
    <text x="25" y="32.5" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">E</text>
    <!-- 3 Lignes de texte -->
    <text x="50" y="19" font-size="7.2" font-weight="800" fill="#065f46" letter-spacing="0.4">CORDE 2</text>
    <text x="50" y="32.5" font-size="11.5" font-weight="900" fill="#064e3b">MI (E)</text>
    <text x="50" y="44" font-size="6.8" font-weight="700" fill="#047857">Clé haut droite</text>
  </g>

  <!-- BAS DROITE : CORDE 1 • LA (A) [ROUGE] -->
  <g transform="translate(274, 72)">
    <rect x="0" y="0" width="144" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2" filter="url(#cardShadow)"/>
    <!-- Icone Lettre -->
    <rect x="7" y="8" width="36" height="36" rx="6" fill="#dc2626"/>
    <text x="25" y="32.5" text-anchor="middle" font-size="18" font-weight="900" fill="#ffffff">A</text>
    <!-- 3 Lignes de texte -->
    <text x="50" y="19" font-size="7.2" font-weight="800" fill="#991b1b" letter-spacing="0.4">CORDE 1</text>
    <text x="50" y="32.5" font-size="11.5" font-weight="900" fill="#7f1d1d">LA (A)</text>
    <text x="50" y="44" font-size="6.8" font-weight="700" fill="#dc2626">Clé bas dr. • Aiguë</text>
  </g>

</svg>