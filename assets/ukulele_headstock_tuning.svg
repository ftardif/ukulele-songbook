<svg viewBox="0 0 540 132" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; margin:0 auto; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Flat Drop Shadow -->
    <filter id="flatSoft" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- ================= 1. SECTION GAUCHE : CLEFS 4 & 3 ================= -->
  <!-- Clé 4 : Sol (G) - Haut Gauche -->
  <g transform="translate(6, 14)">
    <rect x="0" y="0" width="112" height="30" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.2" filter="url(#flatSoft)"/>
    <rect x="5" y="4" width="22" height="22" rx="4" fill="#ea580c"/>
    <text x="16" y="19.5" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">G</text>
    <text x="33" y="13.5" font-size="7.2" font-weight="800" fill="#9a3412">CORDE 4 • SOL</text>
    <text x="33" y="23" font-size="6" font-weight="600" fill="#c2410c">Clé haut gauche</text>
    <!-- Ligne droite épurée reliant la clé -->
    <line x1="112" y1="15" x2="152" y2="24" stroke="#f97316" stroke-width="1.4" stroke-dasharray="2.5,2"/>
    <circle cx="152" cy="24" r="2.2" fill="#f97316"/>
  </g>

  <!-- Clé 3 : Do (C) - Bas Gauche (Le plus grave) -->
  <g transform="translate(6, 62)">
    <rect x="0" y="0" width="112" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" filter="url(#flatSoft)"/>
    <rect x="5" y="4" width="22" height="22" rx="4" fill="#2563eb"/>
    <text x="16" y="19.5" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">C</text>
    <text x="33" y="13.5" font-size="7.2" font-weight="800" fill="#1e40af">CORDE 3 • DO</text>
    <text x="33" y="23" font-size="6" font-weight="700" fill="#2563eb">Clé bas gauche (Grave)</text>
    <!-- Ligne droite épurée reliant la clé -->
    <line x1="112" y1="15" x2="152" y2="6" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="2.5,2" transform="translate(0, 62)"/>
    <circle cx="152" cy="68" r="2.2" fill="#3b82f6"/>
  </g>

  <!-- ================= 2. SECTION CENTRE : TÊTE & MANCHE ================= -->
  <g transform="translate(160, 4)" filter="url(#flatSoft)">
    <!-- Manche / Touche -->
    <rect x="18" y="72" width="36" height="54" fill="#2e190e" rx="1.5"/>
    <!-- Frettes -->
    <line x1="18" y1="86" x2="54" y2="86" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="18" y1="102" x2="54" y2="102" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="18" y1="118" x2="54" y2="118" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Sillet de tête (Nut) -->
    <rect x="16" y="66" width="40" height="6.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" rx="1.5"/>

    <!-- Tête de manche (Flat Wood) -->
    <path d="M 18,66 
             C 14,46 12,24 14,14 
             C 15,7 21,3 27,6 
             C 31,8 36,4 36,4 
             C 36,4 41,8 45,6 
             C 51,3 57,7 58,14 
             C 60,24 58,46 54,66 Z" 
          fill="#d97706" stroke="#92400e" stroke-width="1.3"/>

    <!-- Logo Ukulélé discret -->
    <circle cx="36" cy="15" r="2.8" fill="#92400e" opacity="0.6"/>
    <text x="36" y="17" text-anchor="middle" font-size="4" font-weight="900" fill="#fef3c7">U</text>

    <!-- Poteaux d'enroulement -->
    <circle cx="21" cy="24" r="2.5" fill="#1e293b"/>
    <circle cx="21" cy="50" r="2.5" fill="#1e293b"/>
    <circle cx="51" cy="24" r="2.5" fill="#1e293b"/>
    <circle cx="51" cy="50" r="2.5" fill="#1e293b"/>

    <!-- Boutons de mécaniques gauche -->
    <rect x="5" y="22.5" width="14" height="3" fill="#e2e8f0" rx="0.8"/>
    <ellipse cx="4" cy="24" rx="4" ry="6.5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
    <rect x="5" y="48.5" width="14" height="3" fill="#e2e8f0" rx="0.8"/>
    <ellipse cx="4" cy="50" rx="4" ry="6.5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>

    <!-- Boutons de mécaniques droite -->
    <rect x="53" y="22.5" width="14" height="3" fill="#e2e8f0" rx="0.8"/>
    <ellipse cx="68" cy="24" rx="4" ry="6.5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
    <rect x="53" y="48.5" width="14" height="3" fill="#e2e8f0" rx="0.8"/>
    <ellipse cx="68" cy="50" rx="4" ry="6.5" fill="#ffffff" stroke="#64748b" stroke-width="1"/>

    <!-- ================= 4 CORDES (SANS CROISEMENT) ================= -->
    <!-- Corde 4 (Sol / G) : Orange (#ea580c) -->
    <line x1="21" y1="24" x2="22" y2="66" stroke="#ea580c" stroke-width="1.5"/>
    <line x1="22" y1="66" x2="22" y2="126" stroke="#ea580c" stroke-width="1.5"/>

    <!-- Corde 3 (Do / C) : Bleu Royal (#2563eb - la plus épaisse) -->
    <line x1="21" y1="50" x2="30" y2="66" stroke="#2563eb" stroke-width="2.3"/>
    <line x1="30" y1="66" x2="30" y2="126" stroke="#2563eb" stroke-width="2.3"/>

    <!-- Corde 2 (Mi / E) : Vert Émeraude (#059669) -->
    <line x1="51" y1="24" x2="42" y2="66" stroke="#059669" stroke-width="1.5"/>
    <line x1="42" y1="66" x2="42" y2="126" stroke="#059669" stroke-width="1.5"/>

    <!-- Corde 1 (La / A) : Rouge Vif (#dc2626 - la plus fine) -->
    <line x1="51" y1="50" x2="50" y2="66" stroke="#dc2626" stroke-width="1.1"/>
    <line x1="50" y1="66" x2="50" y2="126" stroke="#dc2626" stroke-width="1.1"/>
  </g>

  <!-- ================= 3. SECTION DROITE : CLEFS 2 & 1 ================= -->
  <!-- Clé 2 : Mi (E) - Haut Droite -->
  <g transform="translate(240, 14)">
    <line x1="-8" y1="10" x2="0" y2="15" stroke="#10b981" stroke-width="1.4" stroke-dasharray="2.5,2"/>
    <circle cx="-8" cy="10" r="2.2" fill="#10b981"/>
    <rect x="0" y="0" width="112" height="30" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2" filter="url(#flatSoft)"/>
    <rect x="5" y="4" width="22" height="22" rx="4" fill="#059669"/>
    <text x="16" y="19.5" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">E</text>
    <text x="33" y="13.5" font-size="7.2" font-weight="800" fill="#065f46">CORDE 2 • MI</text>
    <text x="33" y="23" font-size="6" font-weight="600" fill="#047857">Clé haut droite</text>
  </g>

  <!-- Clé 1 : La (A) - Bas Droite (Le plus aigu) -->
  <g transform="translate(240, 62)">
    <line x1="-8" y1="6" x2="0" y2="15" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="2.5,2"/>
    <circle cx="-8" cy="6" r="2.2" fill="#ef4444"/>
    <rect x="0" y="0" width="112" height="30" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2" filter="url(#flatSoft)"/>
    <rect x="5" y="4" width="22" height="22" rx="4" fill="#dc2626"/>
    <text x="16" y="19.5" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">A</text>
    <text x="33" y="13.5" font-size="7.2" font-weight="800" fill="#991b1b">CORDE 1 • LA</text>
    <text x="33" y="23" font-size="6" font-weight="700" fill="#dc2626">Clé bas droite (Aiguë)</text>
  </g>

  <!-- ================= 4. SECTION DROITE EXTÉRIEURE : JAUGE DE HAUTEUR RÉELLE ================= -->
  <g transform="translate(366, 6)">
    <!-- Fond de la jauge -->
    <rect x="0" y="0" width="168" height="122" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#flatSoft)"/>
    
    <!-- En-tête de la jauge -->
    <rect x="5" y="5" width="158" height="16" rx="3.5" fill="#0f172a"/>
    <text x="84" y="16" text-anchor="middle" font-size="6.5" font-weight="800" fill="#f8fafc" letter-spacing="0.4">HAUTEUR DU SON (PITCH)</text>

    <!-- Étape 4 (Sommet) : Corde 1 - La (A) - Le plus aigu -->
    <g transform="translate(8, 25)">
      <rect x="0" y="0" width="152" height="20" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <rect x="3" y="3" width="16" height="14" rx="2.5" fill="#dc2626"/>
      <text x="11" y="13.5" text-anchor="middle" font-size="8" font-weight="900" fill="#ffffff">A</text>
      <text x="24" y="9.5" font-size="6.5" font-weight="800" fill="#991b1b">Corde 1 — LA (440 Hz)</text>
      <text x="24" y="16.5" font-size="5.4" font-weight="700" fill="#dc2626">▲ 4. LE PLUS AIGU</text>
    </g>

    <!-- Étape 3 : Corde 4 - Sol (G) - Accord réentrant -->
    <g transform="translate(8, 48)">
      <rect x="0" y="0" width="152" height="20" rx="4" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
      <rect x="3" y="3" width="16" height="14" rx="2.5" fill="#ea580c"/>
      <text x="11" y="13.5" text-anchor="middle" font-size="8" font-weight="900" fill="#ffffff">G</text>
      <text x="24" y="9.5" font-size="6.5" font-weight="800" fill="#9a3412">Corde 4 — SOL (392 Hz)</text>
      <text x="24" y="16.5" font-size="5.4" font-weight="800" fill="#c2410c">⚡ 3. Sol aigu (réentrant)</text>
    </g>

    <!-- Étape 2 : Corde 2 - Mi (E) -->
    <g transform="translate(8, 71)">
      <rect x="0" y="0" width="152" height="20" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
      <rect x="3" y="3" width="16" height="14" rx="2.5" fill="#059669"/>
      <text x="11" y="13.5" text-anchor="middle" font-size="8" font-weight="900" fill="#ffffff">E</text>
      <text x="24" y="9.5" font-size="6.5" font-weight="800" fill="#065f46">Corde 2 — MI (330 Hz)</text>
      <text x="24" y="16.5" font-size="5.4" font-weight="600" fill="#047857">● 2. Médium</text>
    </g>

    <!-- Étape 1 (Base) : Corde 3 - Do (C) - Le plus grave -->
    <g transform="translate(8, 94)">
      <rect x="0" y="0" width="152" height="20" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
      <rect x="3" y="3" width="16" height="14" rx="2.5" fill="#2563eb"/>
      <text x="11" y="13.5" text-anchor="middle" font-size="8" font-weight="900" fill="#ffffff">C</text>
      <text x="24" y="9.5" font-size="6.5" font-weight="800" fill="#1e40af">Corde 3 — DO (261 Hz)</text>
      <text x="24" y="16.5" font-size="5.4" font-weight="700" fill="#2563eb">▼ 1. LE PLUS GRAVE</text>
    </g>
  </g>

</svg>